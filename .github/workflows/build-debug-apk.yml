name: Build debug APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Run Node tests
        run: npm test

      - name: Validate decision fixtures
        run: npm run validate:fixtures

      - name: Validate Uber card fixtures
        run: npm run validate:uber-cards

      - name: Test and assemble debug APK
        run: gradle -p android test assembleDebug --no-daemon

      - name: Generate APK SHA-256
        shell: bash
        run: sha256sum android/app/build/outputs/apk/debug/app-debug.apk > sha256.txt

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nexo-driver-debug-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            sha256.txt
          if-no-files-found: error
